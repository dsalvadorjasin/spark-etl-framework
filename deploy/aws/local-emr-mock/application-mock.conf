# Local mock overlay: layered after application-cloud.conf (--application-conf application-cloud.conf,application-mock.conf).
# Points S3A at the local S3 emulator; mock credentials are passed only through AWS_* environment variables.
application.runtime {
  # Kept out of hadoopConfiguration: HOCON cannot hold both fs.s3a.endpoint and fs.s3a.endpoint.region.
  spark.hadoop.fs.s3a.endpoint = "http://localhost:5000"

  hadoopConfiguration {
    fs.s3a.path.style.access = true
    fs.s3a.connection.ssl.enabled = false
    fs.s3a.aws.credentials.provider = "com.amazonaws.auth.EnvironmentVariableCredentialsProvider"
  }
}
