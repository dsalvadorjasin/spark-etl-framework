# AWS (S3 + EMR) configuration for pipeline_fileRead-fileWrite.xml.
# Config, pipeline and SQL files are shipped with spark-submit --files, so scripts_uri is the container working dir.
# Credentials come from the EMR instance-profile role; secrets come from environment variables.
events {
  process_date = "20200918"

  users_input = "s3a://spark-etl-migration-demo/v1/input/users"
  events_input = "s3a://spark-etl-migration-demo/v1/input/events"
  train_input = "s3a://spark-etl-migration-demo/v1/input/train"

  output_dir = "s3a://spark-etl-migration-demo/v1/output/features"

  db.password = ${?DB_PASSWORD}
  flight.password = ${?FLIGHT_PASSWORD}
}

application {
  security.decryption.key = ${?DECRYPTION_KEY}

  scripts_uri = "."
  process_date = "2021-02-06"

  runtime {
    validationRun = "false"
    filesystem.skip.write.checksum = true

    spark.serializer = "org.apache.spark.serializer.KryoSerializer"
    # Kept out of hadoopConfiguration: HOCON cannot hold both fs.s3a.fast.upload and fs.s3a.fast.upload.buffer.
    spark.hadoop.fs.s3a.fast.upload = true

    hadoopConfiguration {
      mapreduce.fileoutputcommitter.marksuccessfuljobs = "false"

      fs.s3a.impl = "org.apache.hadoop.fs.s3a.S3AFileSystem"
      fs.s3a.aws.credentials.provider = "com.amazonaws.auth.InstanceProfileCredentialsProvider"
      fs.s3a.endpoint.region = "us-east-2"
      fs.s3a.connection.maximum = 100
      fs.s3a.fast.upload.buffer = "bytebuffer"
      fs.s3a.multipart.size = "104857600"
      fs.s3a.block.size = "134217728"
    }
  }
}
